name: Compile LaTeX Resumes

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write  # Required for committing PDFs back to repo
  
jobs:
  compile-resumes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper commits
      
      - name: Compile Frontend Resume
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: frontend
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          compiler: latexmk
          
      - name: Compile Backend Resume
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: backend
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          compiler: latexmk
          
      - name: Compile Fullstack Resume
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: fullstack
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          compiler: latexmk
          
      - name: Organize PDFs
        run: |
          # Rename PDFs to descriptive names
          cp frontend/main.pdf frontend/frontend-resume.pdf
          cp backend/main.pdf backend/backend-resume.pdf
          cp fullstack/main.pdf fullstack/fullstack-resume.pdf
          
      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-resumes
          path: |
            frontend/frontend-resume.pdf
            backend/backend-resume.pdf
            fullstack/fullstack-resume.pdf
          retention-days: 90
          
      - name: Commit and push PDFs to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/frontend-resume.pdf
          git add backend/backend-resume.pdf
          git add fullstack/fullstack-resume.pdf
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update compiled resume PDFs [skip ci]"
            git push
          fi
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ steps.date.outputs.date }}
          name: Resume Compilation - ${{ steps.date.outputs.date }}
          body: |
            Automatically compiled resumes from commit ${{ github.sha }}
            
            **Changes in this build:**
            ${{ github.event.head_commit.message }}
            
            Download the PDFs below:
            - Frontend Resume
            - Backend Resume  
            - Fullstack Resume
          files: |
            frontend/frontend-resume.pdf
            backend/backend-resume.pdf
            fullstack/fullstack-resume.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
